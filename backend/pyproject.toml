[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextforge"
version = "0.1.0"
description = "Provenance-aware hybrid retrieval and entity-resolution engine with confidence-aware abstention."
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "rapidfuzz>=3.6",
    "pypdf>=4.0",
    "snowballstemmer>=2.2",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "pgvector>=0.2.5",
]

[project.optional-dependencies]
# spaCy NER improves PERSON/ORG/LOCATION/DATE extraction. Without it the
# rule-based extractor is used. The English model is installed separately:
#   pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
nlp = ["spacy>=3.7"]
# Alternative embedding backend (pulls in PyTorch, ~1-2 GB).
st = ["sentence-transformers>=2.6"]
dev = ["pytest>=8", "fpdf2>=2.7", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires a reachable PostgreSQL with pgvector (CF_TEST_DATABASE_URL)",
    "model: requires the ONNX MiniLM model files on disk",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
